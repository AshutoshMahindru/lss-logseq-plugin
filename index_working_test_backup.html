<!doctype html>
<html>
  <body>
    <h1>LSS Plugin HTML Loaded</h1>

    <script src="https://cdn.jsdelivr.net/npm/@logseq/libs/dist/lsplugin.user.js"></script>

    <script>
      console.log("LSS INLINE SCRIPT LOADED");

      function main() {
        console.log("LSS LOGSEQ READY");

        logseq.App.showMsg("LSS Plugin Loaded");

        logseq.App.registerCommandPalette(
          {
            key: "lss-test-command",
            label: "LSS: Test Command"
          },
          async () => {
            logseq.App.showMsg("LSS command works");
          }
        );

        console.log("LSS COMMAND REGISTERED");
      }

      logseq.ready(main).catch(console.error);
    </script>
  </body>
</html>
