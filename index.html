<html>
  <head>
    <meta charset="UTF-8" />
    <title>LSS Graph Engine</title>

    <style>

      body{
        margin:0;
        background:transparent;
        font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
      }

    </style>

  </head>

  <body>

    <script src="https://cdn.jsdelivr.net/npm/@logseq/libs/dist/lsplugin.user.js"></script>

    <script>

      window.LSS = window.LSS || {};

      LSS.REGISTRY = {
        entities: [
          {
            name:"Subject",
            page:"Entity/Subject",
            area:"Area/Learning",
            template:"Templates/subject"
          },
          {
            name:"Course",
            page:"Entity/Course",
            area:"Area/Learning",
            template:"Templates/course"
          },
          {
            name:"Lesson",
            page:"Entity/Lesson",
            area:"Area/Learning",
            template:"Templates/lesson"
          },
          {
            name:"Project",
            page:"Entity/Project",
            area:"Area/Work",
            template:"Templates/project"
          }
        ],

        forms: [
          {
            name:"Question",
            page:"Form/Question",
            template:"Templates/question"
          },
          {
            name:"Insight",
            page:"Form/Insight",
            template:"Templates/insight"
          }
        ]
      };

      LSS.nowISO = function(){
        return new Date().toISOString();
      };

      LSS.cleanName = function(name){

        return String(name || "")
          .trim()
          .replaceAll("[[","")
          .replaceAll("]]","");

      };

      

      LSS.extractWikiRefs = function(text){

        const refs = [];
        const re = /\[\[([^\]]+)\]\]/g;
        let m;

        while((m = re.exec(text || ""))){
          refs.push(m[1]);
        }

        return refs;

      };

      LSS.toEntityName = function(entityPage){

        return String(entityPage || "")
          .replace("Entity/","")
          .trim();

      };

      LSS.toTemplatePage = function(entityName){

        return "Templates/" +
          String(entityName || "")
            .toLowerCase()
            .replace(/\s+/g,"-");

      };

      LSS.readEntityHierarchyFromPage =
        async function(){

          const pageName = "Entity-Page";

          const blocks =
            await logseq.Editor.getPageBlocksTree(
              pageName
            );

          const entities = [];
          const parentRules = {};
          const crossCutting = [];

          function walk(items, context){

            for(const block of items || []){

              const content =
                block.content || "";

              const refs =
                LSS.extractWikiRefs(content);

              const isCross =
                /cross[- ]cutting|cross cutting/i
                  .test(content) ||
                context.crossCutting;

              const areaRef =
                refs.find(
                  r => r.startsWith("Area/")
                ) || context.area;

              const entityRef =
                refs.find(
                  r => r.startsWith("Entity/")
                );

              let nextContext = {
                area: areaRef,
                entity: context.entity,
                crossCutting: isCross
              };

              if(entityRef){

                const entityName =
                  LSS.toEntityName(entityRef);

                const item = {
                  name: entityName,
                  page: entityRef,
                  area: areaRef || "Area/Cross-Cutting",
                  template: LSS.toTemplatePage(entityName),
                  crossCutting: isCross
                };

                if(
                  !entities.find(
                    e => e.page === item.page
                  )
                ){
                  entities.push(item);
                }

                if(isCross){
                  crossCutting.push(entityName);
                }

                if(context.entity){

                  parentRules[entityName] =
                    parentRules[entityName] || {
                      parents: []
                    };

                  parentRules[entityName]
                    .parents
                    .push(context.entity);

                }else if(areaRef){

                  parentRules[entityName] =
                    parentRules[entityName] || {
                      parents: []
                    };

                  parentRules[entityName]
                    .parents
                    .push(areaRef);

                }

                nextContext.entity =
                  entityRef;

              }

              walk(
                block.children || [],
                nextContext
              );

            }

          }

          walk(blocks, {
            area:"",
            entity:"",
            crossCutting:false
          });

          for(const key of Object.keys(parentRules)){

            parentRules[key].parents =
              [...new Set(parentRules[key].parents)];

          }

          if(entities.length){

            LSS.REGISTRY.entities = entities;
            LSS.DYNAMIC_PARENT_RULES = parentRules;
            LSS.CROSS_CUTTING_ENTITY_TYPES =
              [...new Set(crossCutting)];

            console.log(
              "LSS dynamic entity schema loaded",
              entities,
              parentRules
            );

          }

          return {
            entities,
            parentRules,
            crossCutting
          };

      };

      LSS.findEntityInstancesByType =
        async function(entityPage){

          try{

            const prefix =
              entityPage.replace("Entity/","")
                .toLowerCase() + "/";

            const result =
              await logseq.DB.datascriptQuery(`
                [:find ?name
                 :where
                 [?b :block/name ?name]
                 [(clojure.string/starts-with? ?name "${prefix}")]]
              `);

            return (result || [])
              .map(x => x[0])
              .filter(Boolean)
              .sort();

          }catch(e){

            console.error(
              "findEntityInstancesByType failed",
              e
            );

            return [];

          }

      };



      LSS.toEntityName =
        function(entityPage){

          return String(entityPage || "")
            .replace("Entity-Page/","")
            .replace("Entity/","")
            .trim();

      };

      LSS.toTemplatePage =
        function(entityName){

          return "Templates/" +
            String(entityName || "")
              .toLowerCase()
              .replace(/\s+/g,"-");

      };

      LSS.parseExistingEntityPageSchema =
        async function(){

          const blocks =
            await logseq.Editor.getPageBlocksTree(
              "Entity-Page"
            );

          const entities = [];
          const parentRules = {};
          const crossCuttingNames = new Set();

          function extractRefs(text){

            const refs = [];
            const re = /\[\[([^\]]+)\]\]/g;
            let m;

            while((m = re.exec(text || ""))){
              refs.push(m[1]);
            }

            return refs;

          }

          function walk(items, ctx){

            for(const block of items || []){

              const content =
                block.content || "";

              const refs =
                extractRefs(content);

              const area =
                refs.find(
                  r => r.startsWith("Area/")
                ) || ctx.area || "";

              const entityPage =
                refs.find(
                  r => r.startsWith("Entity-Page/")
                );

              const isCross =
                /Cross-Cutting|cross-cutting|Cross Cutting/i
                  .test(content) ||
                ctx.crossCutting;

              let nextCtx = {
                area,
                parentEntity: ctx.parentEntity,
                crossCutting: isCross
              };

              if(entityPage){

                const name =
                  LSS.toEntityName(entityPage);

                const entity = {
                  name,
                  page: entityPage,
                  area: area || "Cross-Cutting",
                  template: LSS.toTemplatePage(name),
                  crossCutting: isCross
                };

                if(!entities.find(e => e.name === name)){
                  entities.push(entity);
                }

                parentRules[name] =
                  parentRules[name] || {
                    parents: []
                  };

                if(isCross){

                  crossCuttingNames.add(name);

                  parentRules[name].parents.push(
                    "Area/Health",
                    "Area/Wealth",
                    "Area/Learning",
                    "Area/Family",
                    "Area/Friends",
                    "Area/Work",
                    "Area/Pursuits"
                  );

                }else if(ctx.parentEntity){

                  parentRules[name].parents.push(
                    ctx.parentEntity
                  );

                }else if(area){

                  parentRules[name].parents.push(
                    area
                  );

                }

                nextCtx.parentEntity =
                  entityPage;

              }

              walk(
                block.children || [],
                nextCtx
              );

            }

          }

          walk(blocks, {
            area:"",
            parentEntity:"",
            crossCutting:false
          });

          for(const key of Object.keys(parentRules)){
            parentRules[key].parents =
              [...new Set(parentRules[key].parents)];
          }

          if(entities.length){

            LSS.REGISTRY.entities =
              entities;

            LSS.DYNAMIC_PARENT_RULES =
              parentRules;

            LSS.CROSS_CUTTING_ENTITY_TYPES =
              [...crossCuttingNames];

            console.log(
              "RIGHT: parsed Entity-Page schema",
              LSS.REGISTRY.entities,
              LSS.DYNAMIC_PARENT_RULES,
              LSS.CROSS_CUTTING_ENTITY_TYPES
            );

          }else{

            console.warn(
              "WRONG: Entity-Page schema parsed zero entities"
            );

          }

          return {
            entities,
            parentRules,
            crossCutting:[...crossCuttingNames]
          };

      };


      LSS.PARENT_RULES = {
        Subject: {
          fallback: "Area/Learning",
          parentPrefix: "area/"
        },
        Course: {
          fallback: "",
          parentPrefix: "subject/"
        },
        Lesson: {
          fallback: "",
          parentPrefix: "course/"
        },
        Project: {
          fallback: "Area/Work",
          parentPrefix: "area/"
        }
      };

      LSS.findPagesByPrefix =
        async function(prefix){

          try{

            const result =
              await logseq.DB.datascriptQuery(`
                [:find ?name
                 :where
                 [?b :block/name ?name]
                 [(clojure.string/starts-with? ?name "${prefix}")]]
              `);

            return (result || [])
              .map(x => x[0])
              .filter(Boolean)
              .sort();

          }catch(e){

            console.error("findPagesByPrefix failed", e);
            return [];

          }

        };



      LSS.findEntityInstancesByType =
        async function(entityPage){

          const typeName =
            LSS.toEntityName(entityPage);

          const prefix =
            typeName.toLowerCase() + "/";

          try{

            const result =
              await logseq.DB.datascriptQuery(`
                [:find ?name
                 :where
                 [?b :block/name ?name]
                 [(clojure.string/starts-with? ?name "${prefix}")]]
              `);

            return (result || [])
              .map(x => x[0])
              .filter(Boolean)
              .sort();

          }catch(e){

            console.error(
              "WRONG: findEntityInstancesByType failed",
              e
            );

            return [];

          }

      };

      LSS.findCandidateParents =
        async function(entity){

          if(!entity)
            return [];

          await LSS.parseExistingEntityPageSchema();

          const rule =
            (LSS.DYNAMIC_PARENT_RULES || {})[
              entity.name
            ];

          const parents = [];

          for(const parent of (rule && rule.parents) || []){

            if(parent.startsWith("Area/")){

              parents.push(parent);

            }else if(parent.startsWith("Entity-Page/")){

              const instances =
                await LSS.findEntityInstancesByType(
                  parent
                );

              parents.push(...instances);

            }

          }

          return [...new Set(parents)].sort();

      };

      LSS.findExistingPage =
        async function(pageName){

          const p =
            await logseq.Editor.getPage(
              pageName
            );

          return !!p;

      };

      LSS.expandTemplate =
        async function(templateName){

          return `
- Objective
- Notes
- Tasks
`;

      };

      LSS.createEntityInstance =
        async function(type,name,parent){

          const entity =
            LSS.REGISTRY.entities.find(
              e => e.name === type
            );

          const pageName =
            `${type}/${name}`;

          const content = `
type:: [[Entity]]
entity-type:: [[${entity.page}]]
related-area:: [[${entity.area}]]
parent:: ${parent ? `[[${parent}]]` : ""}
template:: [[${entity.template}]]
created-at:: ${LSS.nowISO()}

- Overview

- Related

- Notes
`;

          await logseq.Editor.createPage(
            pageName,
            {},
            {
              createFirstBlock:true
            }
          );

          const blocks =
            await logseq.Editor.getPageBlocksTree(
              pageName
            );

          if(blocks && blocks.length){

            await logseq.Editor.updateBlock(
              blocks[0].uuid,
              content
            );

          }

          if(parent){

            const parentBlocks =
              await logseq.Editor.getPageBlocksTree(
                parent
              );

            let relatedBlock = null;

            for(const b of parentBlocks || []){

              if(
                (b.content || "").trim() === "Related"
              ){
                relatedBlock = b;
              }

            }

            if(!relatedBlock){

              relatedBlock =
                await logseq.Editor.insertBlock(
                  parentBlocks[
                    parentBlocks.length - 1
                  ].uuid,
                  "Related",
                  {
                    sibling:true
                  }
                );

            }

            const plural =
              type.endsWith("s")
                ? type
                : type + "s";

            const refreshed =
              await logseq.Editor.getPageBlocksTree(
                parent
              );

            let typeBlock = null;

            function scan(items){

              for(const i of items || []){

                if(
                  (i.content || "").trim() === plural
                ){
                  return i;
                }

                const nested =
                  scan(i.children);

                if(nested)
                  return nested;

              }

              return null;

            }

            typeBlock =
              scan(refreshed);

            if(!typeBlock){

              typeBlock =
                await logseq.Editor.insertBlock(
                  relatedBlock.uuid,
                  plural,
                  {
                    sibling:false
                  }
                );

            }

            await logseq.Editor.insertBlock(
              typeBlock.uuid,
              `[[${pageName}]]`,
              {
                sibling:false
              }
            );

          }

          await logseq.App.pushState(
            "page",
            {
              name:pageName
            }
          );

      };

      LSS.showCreatorPanel =
        async function(mode){

          logseq.showMainUI();

          if(mode === "entity"){
            await LSS.readEntityHierarchyFromPage();
          }

          if(mode === "entity"){
            await LSS.parseExistingEntityPageSchema();
          }

          const types =
            mode === "entity"
              ? LSS.REGISTRY.entities
              : LSS.REGISTRY.forms;

          const grouped = {};

          for(const t of types){

            const area =
              t.area || "Forms";

            grouped[area] =
              grouped[area] || [];

            grouped[area].push(t);

          }

          const options =
            Object.entries(grouped)
              .map(([group,items])=>{

                return `
<optgroup label="${group}">
${
  items.map(
    i=>`<option value="${i.name}">
${i.name}
</option>`
  ).join("")
}
</optgroup>
`;

              }).join("");

          document.body.innerHTML = `

<style>

}

}

padding:24px;

}

}

</style>

<div class="lss-shell">

<div class="lss-left">
<h2>LSS Creator</h2>
Ontology-driven graph object creation
</div>

<div class="lss-center">

<label>Type</label>

<select id="lss-type">
${options}
</select>

<label>Parent Filter</label>

<input
id="lss-parent-search"
placeholder="Type to filter available parents..."
/>

<label>Available Parent</label>

<select id="lss-parent"></select>

<label>Create Missing Parent In-Situ</label>

<input
id="lss-inline-parent-name"
placeholder="Optional: create parent if not listed"
/>

<label>Create Missing Grandparent In-Situ</label>

<input
id="lss-inline-grandparent-name"
placeholder="Optional: create grandparent first"
/>

<label>Name</label>

<input
id="lss-name"
placeholder="AI Foundations"
/>

<label>Namespace Preview</label>

<div
id="lss-namespace-preview"

></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

id="lss-close"
>

</button>

>
Create Object
</button>
</div>

</div>

<div class="lss-right">

<label>Relationship Preview</label>

<div
id="lss-relationship-preview"
class="preview"
></div>

<label>Template Preview</label>

></div>

</div>

</div>
`;

          async function refresh(){

            const type =
              document.getElementById(
                "lss-type"
              ).value;

            const name =
              document.getElementById(
                "lss-name"
              ).value;

            const entity =
              types.find(
                t => t.name === type
              );

            const allowedParents =
              await LSS.findCandidateParents(
                entity
              );

            const search =
              (
                document.getElementById(
                  "lss-parent-search"
                ).value || ""
              ).toLowerCase();

            const filtered =
              allowedParents.filter(
                p => String(p).toLowerCase().includes(search)
              );

            document.getElementById(
              "lss-parent"
            ).innerHTML =
              filtered.length
                ? filtered.map(
                    p=>`<option value="${p}">
${p}
</option>`
                  ).join("")
                : `<option value="">No parent / root object</option>`;

            const parent =
              document.getElementById(
                "lss-parent"
              ).value;

            document.getElementById(
              "lss-namespace-preview"
            ).innerText =
              `[[${type}/${name}]]`;

            document.getElementById(
              "lss-relationship-preview"
            ).innerText =
parent
  ? `${parent}
  └── Related
      └── ${type}s
          └── ${type}/${name || "..."}`
  : `${type}/${name || "..."} will be created as a root/top-level object`;

            document.getElementById(
              "lss-template-preview"
            ).innerText =
              await LSS.expandTemplate(
                entity.template
              );

          }

          document.getElementById(
            "lss-type"
          ).onchange = refresh;

          document.getElementById(
            "lss-name"
          ).oninput = refresh;

          document.getElementById(
            "lss-parent-search"
          ).oninput = refresh;

          document.getElementById(
            "lss-parent"
          ).onchange = refresh;

          document.getElementById(
            "lss-close"
          ).onclick = ()=>{

            logseq.hideMainUI();

          };

          document.addEventListener(
            "keydown",
            function(e){
              if(e.key === "Escape"){
                logseq.hideMainUI();
              }
            }
          );

          document.getElementById(
            "lss-create"
          ).onclick = async ()=>{

            const type =
              document.getElementById(
                "lss-type"
              ).value;

            const name =
              document.getElementById(
                "lss-name"
              ).value;

            let parent =
              document.getElementById(
                "lss-parent"
              ).value;

            const inlineParentName =
              document.getElementById(
                "lss-inline-parent-name"
              ).value.trim();

            const inlineGrandparentName =
              document.getElementById(
                "lss-inline-grandparent-name"
              ).value.trim();

            if(inlineParentName){

              const currentEntity =
                LSS.REGISTRY.entities.find(
                  e => e.name === type
                );

              const rule =
                (LSS.DYNAMIC_PARENT_RULES || {})[
                  currentEntity.name
                ];

              const parentEntityPage =
                rule &&
                rule.parents &&
                rule.parents.find(
                  p => p.startsWith("Entity-Page/")
                );

              if(parentEntityPage){

                const parentType =
                  LSS.toEntityName(
                    parentEntityPage
                  );

                let grandparent = "";

                if(inlineGrandparentName){

                  const parentEntity =
                    LSS.REGISTRY.entities.find(
                      e => e.name === parentType
                    );

                  const parentRule =
                    (LSS.DYNAMIC_PARENT_RULES || {})[
                      parentType
                    ];

                  const grandparentTypePage =
                    parentRule &&
                    parentRule.parents &&
                    parentRule.parents.find(
                      p => p.startsWith("Entity-Page/")
                    );

                  if(grandparentTypePage){

                    const grandparentType =
                      LSS.toEntityName(
                        grandparentTypePage
                      );

                    await LSS.createEntityInstance(
                      grandparentType,
                      inlineGrandparentName,
                      ""
                    );

                    grandparent =
                      `${grandparentType}/${inlineGrandparentName}`;

                  }

                }

                await LSS.createEntityInstance(
                  parentType,
                  inlineParentName,
                  grandparent
                );

                parent =
                  `${parentType}/${inlineParentName}`;

              }

            }

            await LSS.createEntityInstance(
              type,
              name,
              parent
            );

            logseq.hideMainUI();

          };

          await refresh();

      };

      function main() {

        console.log(
          "LSS GRAPH ENGINE READY"
        );

        logseq.App.showMsg(
          "LSS Graph Engine Loaded"
        );

        logseq.App.registerCommandPalette(
          {
            key:"lss-create-entity",
            label:"LSS: Create Entity Instance"
          },

          async ()=>{

            await LSS.showCreatorPanel(
              "entity"
            );

          }

        );

      }

      logseq.ready(main)
        .catch(console.error);

    </script>
